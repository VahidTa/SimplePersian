name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 evals/sp_lint.py --self-test
      - run: node --test src/hooks/simple-persian-activate.test.js
      - run: python3 src/hooks/test_lint_hook.py
      - run: python3 -c 'import json, pathlib; [json.loads(p.read_text(encoding="utf-8")) for p in pathlib.Path(".").rglob("*.json")]'
